---
- name: Deploy or repair the Mayday target
  hosts: mayday
  become: true
  gather_facts: false
  vars:
    workers: "{{ lookup('ansible.builtin.env', 'WORKERS', default='2') | int }}"
    build_sha: "{{ lookup('ansible.builtin.env', 'TF_VAR_spacelift_commit_sha') }}"
    artifact_url: "https://github.com/spacelift-solutions/Mayday/releases/download/build-{{ build_sha }}/mayday-linux-amd64"
  pre_tasks:
    - name: Validate the bounded capacity setting
      ansible.builtin.assert:
        that:
          - workers | int in [2, 8]
        fail_msg: Mayday supports two or eight application workers
    - name: Wait for the provisioned host
      ansible.builtin.wait_for_connection:
        timeout: 180
      when: not ansible_check_mode
    - name: Require the exact source commit for artifact selection
      ansible.builtin.assert:
        that:
          - build_sha is match('^[0-9a-f]{40}$')
        fail_msg: TF_VAR_spacelift_commit_sha must identify the GitHub Actions build to deploy
  tasks:
    - name: Create the service user
      ansible.builtin.user:
        name: mayday
        system: true
        shell: /usr/sbin/nologin
        create_home: false
    - name: Install the checksum-verified GitHub Actions artifact
      ansible.builtin.get_url:
        url: "{{ artifact_url }}"
        checksum: "sha256:{{ artifact_url }}.sha256"
        dest: /usr/local/bin/mayday
        owner: root
        group: root
        mode: "0755"
        timeout: 30
      register: artifact_download
      until: artifact_download is succeeded
      retries: 30
      delay: 10
      notify: Restart Mayday
      when: not ansible_check_mode
    - name: Configure the target
      ansible.builtin.template:
        src: mayday.env.j2
        dest: /etc/mayday.env
        owner: root
        group: mayday
        mode: "0640"
      notify: Restart Mayday
    - name: Install the service unit
      ansible.builtin.copy:
        src: mayday.service
        dest: /etc/systemd/system/mayday.service
        mode: "0644"
      notify: Restart Mayday
    - name: Apply service changes
      ansible.builtin.meta: flush_handlers
    - name: Ensure Mayday is running
      ansible.builtin.systemd_service:
        name: mayday
        enabled: true
        state: started
        daemon_reload: true
      when: not ansible_check_mode
    - name: Check process liveness
      ansible.builtin.uri:
        url: http://127.0.0.1:8081/livez
      register: liveness
      until: liveness.status == 200
      retries: 10
      delay: 2
      when: not ansible_check_mode
  handlers:
    - name: Restart Mayday
      ansible.builtin.systemd_service:
        name: mayday
        state: restarted
        enabled: true
        daemon_reload: true
      when: not ansible_check_mode
