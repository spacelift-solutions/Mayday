name: Publish demo artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-${{ github.sha }}
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile Linux artifact
        run: make build-linux
      - name: Publish service binary for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp bin/linux-amd64/mayday bin/mayday-linux-amd64
          (cd bin && sha256sum mayday-linux-amd64 > mayday-linux-amd64.sha256)
          tag="build-${GITHUB_SHA}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" bin/mayday-linux-amd64 bin/mayday-linux-amd64.sha256 \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Mayday build ${GITHUB_SHA}" \
              --notes "Service binary built by GitHub Actions for ${GITHUB_SHA}."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mayday-linux-amd64
          path: bin/linux-amd64/mayday
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/spacelift-solutions/mayday:main
            ghcr.io/spacelift-solutions/mayday:${{ github.sha }}
