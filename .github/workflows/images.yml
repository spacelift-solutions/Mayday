name: Publish demo images
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile Linux artifact
        run: make build-linux
      - uses: actions/upload-artifact@v4
        with:
          name: mayday-linux-amd64
          path: bin/linux-amd64/mayday
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/spacelift-solutions/mayday:main
            ghcr.io/spacelift-solutions/mayday:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runner
          push: true
          tags: |
            ghcr.io/spacelift-solutions/mayday-runner:main
            ghcr.io/spacelift-solutions/mayday-runner:${{ github.sha }}
